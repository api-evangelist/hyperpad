aid: hyperpad
name: Hyperpad
description: >-
  Hyperpad (hyperPad) is a no-code, visual game development platform for iPad,
  often described as "HyperCard for iPad." Founded in 2013 and backed by Y
  Combinator (Summer 2014), the London, Ontario company lets non-programmers
  build media-rich 2D games and interactive apps using a drag-and-drop,
  node-based behavior system with a built-in physics engine, particle effects,
  animation and audio tools, and a bundled asset library, then publish them to
  the Apple App Store as native apps while keeping 100% of royalties. Products
  include the paid hyperPad app, a free hyperPad Starter edition, and hyperPad
  Hub, a community arcade for playing games made with the platform. hyperPad is
  a consumer-facing creation tool and does not currently publish a public web
  API or developer platform.
